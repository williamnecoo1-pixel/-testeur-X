name: XHTTP Real Delay Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: xhttp-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout checker code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests[socks]==2.32.3"
          python -m pip show requests
          python -c "import sys, requests, socks; print('Python:', sys.executable); print('requests:', requests.__version__); print('Python dependencies OK')"

      - name: Download Xray Core
        run: |
          mkdir -p xray
          curl -fL \
            "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip" \
            -o xray.zip
          unzip -o xray.zip xray -d xray
          chmod +x xray/xray
          ./xray/xray version

      - name: Download and test source configs
        env:
          WORKERS: "25"
          XRAY_BIN: "./xray/xray"
          PYTHONUNBUFFERED: "1"
        run: python -u main.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhttp-check-results
          path: |
            working_configs.txt
            failed_configs.txt
            results.csv
          if-no-files-found: warn
          retention-days: 14

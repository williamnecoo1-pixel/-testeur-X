name: XHTTP Real Delay Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: xhttp-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Xray Core
        run: |
          mkdir -p xray
          curl -fL \
            "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip" \
            -o xray.zip
          unzip -o xray.zip xray -d xray
          chmod +x xray/xray
          ./xray/xray version

      - name: Run checker
        env:
          WORKERS: "25"
          XRAY_BIN: "./xray/xray"
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_configs.txt failed_configs.txt results.csv
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Update XHTTP working configs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

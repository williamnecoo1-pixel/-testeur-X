name: VLESS Config Tester

on:
  schedule:
    # كل 8 ساعات (الساعة 00:00، 08:00، 16:00 بتوقيت UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:   # يسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: write   # ضروري لعمل commit لملف working.txt

jobs:
  test-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run VLESS tester
        run: python main.py

      - name: 📤 Upload working.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: working-configs
          path: working.txt
          if-no-files-found: warn

      - name: 💾 Commit and push working.txt (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add working.txt
          if git diff --staged --quiet; then
            echo "لا توجد تغييرات في working.txt"
          else
            git commit -m "chore: update working configs [skip ci]"
            git push
          fi

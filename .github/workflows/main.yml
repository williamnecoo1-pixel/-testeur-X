name: VLESS Config Tester

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      max_workers:
        description: 'عدد Workers'
        default: '40'
      limit:
        description: 'حد أقصى للإعدادات (0 = الكل)'
        default: '0'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  MAX_WORKERS: ${{ github.event.inputs.max_workers || '40' }}
  PER_TEST_TIMEOUT: '8'
  LIMIT_PER_RUN: ${{ github.event.inputs.limit || '0' }}
  SHUFFLE: '0'
  PROGRESS_EVERY: '100'

jobs:
  test-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ المكتبات جاهزة"

      - name: 🧪 Run tester (Live)
        run: |
          set -euo pipefail
          stdbuf -oL -eL python -u main.py 2>&1 | tee run.log

      - name: 📊 Result summary
        if: always()
        run: |
          if [ -s working.txt ]; then
            echo "✅ عدد الإعدادات العاملة: $(wc -l < working.txt)"
            head -n 5 working.txt
          else
            echo "⚠️ لا توجد إعدادات عاملة"
          fi

      - name: 📤 Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vless-results-${{ github.run_number }}
          path: |
            working.txt
            run.log
          retention-days: 7
          if-no-files-found: warn

      - name: 💾 Commit working.txt
        if: success()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add working.txt
          if git diff --staged --quiet; then
            echo "ℹ️ لا تغيير"
          else
            git commit -m "chore: update working configs [skip ci]"
            git push
          fi

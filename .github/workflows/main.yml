name: VLESS Config Tester

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # ← هذا هو المفتاح: يجبر Python على عدم تخزين الـ output فـ buffer
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install deps
        run: |
          set -euo pipefail
          echo "▶️  تحديث pip..."
          python -m pip install --upgrade pip
          echo "▶️  تثبيت المكتبات..."
          pip install -r requirements.txt
          echo "✅ المكتبات جاهزة"

      - name: 🧪 Run tester (Live logs)
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "🚀 بدأ الاختبار: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=================================================="
          # -u = unbuffered  |  stdbuf = line-buffered حتى مع subprocess
          stdbuf -oL -eL python -u main.py 2>&1 | tee run.log
          echo "=================================================="
          echo "🏁 انتهى الاختبار: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=================================================="

      - name: 📊 Show result summary
        if: always()
        run: |
          echo "📄 محتوى working.txt:"
          echo "--------------------------------------------------"
          if [ -s working.txt ]; then
            cat working.txt
            echo "--------------------------------------------------"
            echo "📈 عدد الإعدادات العاملة: $(wc -l < working.txt)"
          else
            echo "(فارغ — لا توجد إعدادات عاملة)"
          fi

      - name: 📤 Upload artifact (working.txt + run.log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vless-results-${{ github.run_number }}
          path: |
            working.txt
            run.log
          if-no-files-found: warn

      - name: 💾 Commit working.txt
        if: success()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add working.txt
          if git diff --staged --quiet; then
            echo "ℹ️  لا توجد تغييرات في working.txt"
          else
            git commit -m "chore: update working configs [skip ci]"
            git push
            echo "✅ تم رفع التحديثات"
          fi
